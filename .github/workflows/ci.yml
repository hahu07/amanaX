name: CI

on:
  push:
  pull_request:

jobs:
  daml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install DPM
        run: curl -sSL https://get.digitalasset.com/install/install.sh | sh
      - name: Install SDK 3.5.2
        run: |
          export PATH="$HOME/.dpm/bin:$PATH"
          dpm install 3.5.2
      - name: Build vendored Token Standard packages
        run: |
          export PATH="$HOME/.dpm/bin:$PATH"
          for pkg in splice-api-token-metadata-v1 splice-api-token-holding-v1 \
                     splice-api-token-transfer-instruction-v1 splice-api-token-allocation-v1 \
                     splice-api-token-allocation-instruction-v1 splice-api-token-allocation-request-v1; do
            (cd "vendor/token-standard/$pkg" && dpm build)
          done
          cp vendor/token-standard/splice-api-token-metadata-v1/.daml/dist/splice-api-token-metadata-v1-1.0.0.dar \
             vendor/token-standard/splice-api-token-metadata-v1/.daml/dist/splice-api-token-metadata-v1-current.dar
          cp vendor/token-standard/splice-api-token-holding-v1/.daml/dist/splice-api-token-holding-v1-1.0.0.dar \
             vendor/token-standard/splice-api-token-holding-v1/.daml/dist/splice-api-token-holding-v1-current.dar
          cp vendor/token-standard/splice-api-token-allocation-v1/.daml/dist/splice-api-token-allocation-v1-1.0.0.dar \
             vendor/token-standard/splice-api-token-allocation-v1/.daml/dist/splice-api-token-allocation-v1-current.dar
      - name: Build AmanaX Daml packages
        run: |
          export PATH="$HOME/.dpm/bin:$PATH"
          cd daml && dpm build --all --package-root main
      - name: Run Daml Script tests
        run: |
          export PATH="$HOME/.dpm/bin:$PATH"
          cd daml/test && dpm test

  # backend/test/*.ts all drive the real Express app via supertest against a
  # live ledger and a live agents service (see docs/deployment.md's
  # "What's not done yet" — these are integration tests, not unit tests
  # with a mocked ledger client), so this job needs both running before
  # `npm test`, per docs/implementation_plan.md §3.6 ("backend integration
  # tests against an ephemeral dpm sandbox"). Milestone 9 finding: this job
  # previously ran `npm test` with neither dependency up, which would fail
  # every integration test — fixed here, not just documented.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install DPM
        run: curl -sSL https://get.digitalasset.com/install/install.sh | sh
      - name: Install SDK 3.5.2
        run: |
          export PATH="$HOME/.dpm/bin:$PATH"
          dpm install 3.5.2
      - name: Build vendored Token Standard packages
        run: |
          export PATH="$HOME/.dpm/bin:$PATH"
          for pkg in splice-api-token-metadata-v1 splice-api-token-holding-v1 \
                     splice-api-token-transfer-instruction-v1 splice-api-token-allocation-v1 \
                     splice-api-token-allocation-instruction-v1 splice-api-token-allocation-request-v1; do
            (cd "vendor/token-standard/$pkg" && dpm build)
          done
          cp vendor/token-standard/splice-api-token-metadata-v1/.daml/dist/splice-api-token-metadata-v1-1.0.0.dar \
             vendor/token-standard/splice-api-token-metadata-v1/.daml/dist/splice-api-token-metadata-v1-current.dar
          cp vendor/token-standard/splice-api-token-holding-v1/.daml/dist/splice-api-token-holding-v1-1.0.0.dar \
             vendor/token-standard/splice-api-token-holding-v1/.daml/dist/splice-api-token-holding-v1-current.dar
          cp vendor/token-standard/splice-api-token-allocation-v1/.daml/dist/splice-api-token-allocation-v1-1.0.0.dar \
             vendor/token-standard/splice-api-token-allocation-v1/.daml/dist/splice-api-token-allocation-v1-current.dar
      - name: Build AmanaX Daml packages
        run: |
          export PATH="$HOME/.dpm/bin:$PATH"
          cd daml && dpm build --all --package-root main
      - name: Start dpm sandbox
        run: |
          export PATH="$HOME/.dpm/bin:$PATH"
          nohup dpm sandbox --dar daml/main/.daml/dist/amanax-main-0.0.1.dar --json-api-port 7575 > sandbox.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:7575/v2/state/ledger-end && exit 0
            sleep 2
          done
          echo "sandbox did not become ready" && cat sandbox.log && exit 1
      - run: npm ci
        working-directory: agents
      - name: Start agents service
        working-directory: agents
        run: |
          nohup npx tsx src/index.ts > agents.log 2>&1 &
          for i in $(seq 1 15); do
            curl -sf http://localhost:4100/health && exit 0
            sleep 1
          done
          echo "agents service did not become ready" && cat agents.log && exit 1
      - run: npm ci
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npm test
        working-directory: backend
        env:
          NODE_ENV: test

  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: agents
      - run: npm run build
        working-directory: agents
      - run: npm test
        working-directory: agents
        env:
          NODE_ENV: test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: frontend
      - run: npx tsc -b
        working-directory: frontend
      - run: npx vite build
        working-directory: frontend
